<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIS - Bittu Sir</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{height:100vh;overflow:hidden;background:#01080d;color:#00eaff;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#00eaff08 1px,transparent 1px),linear-gradient(90deg,#00eaff08 1px,transparent 1px);background-size:30px 30px}.app{position:relative;height:100vh;display:flex;flex-direction:column;align-items:center}.header{text-align:center;padding-top:18px;z-index:5}.header h1{font-size:30px;letter-spacing:8px;text-shadow:0 0 20px #00eaff}.header p{font-size:11px;letter-spacing:3px;margin-top:5px}#status{display:inline-block;margin-top:10px;padding:7px 18px;border:1px solid #00eaff;border-radius:20px;font-size:11px;box-shadow:0 0 15px #00eaff55}.hud{position:relative;width:min(88vw,420px);aspect-ratio:1;margin-top:18px}.ring{position:absolute;border-radius:50%}.r1{inset:0;border:3px solid #00eaff;box-shadow:0 0 25px #00eaff;animation:spin 15s linear infinite}.r2{inset:8%;border:2px dashed #38eaff;animation:reverseSpin 10s linear infinite}.r3{inset:18%;border:8px solid #075d70;border-top-color:#00eaff;border-bottom-color:#00eaff;animation:spin 5s linear infinite}.r4{inset:27%;border:2px solid #8ffaff;box-shadow:0 0 30px #00eaff,inset 0 0 25px #00eaff}.ticks{position:absolute;inset:4%;border-radius:50%;background:repeating-conic-gradient(transparent 0deg 8deg,#00eaff 8deg 9deg);-webkit-mask:radial-gradient(transparent 72%,#000 73%,#000 76%,transparent 77%);mask:radial-gradient(transparent 72%,#000 73%,#000 76%,transparent 77%)}.core{position:absolute;inset:31%;border-radius:50%;background:radial-gradient(circle,#06313b,#01090d 70%);border:2px solid #8ffaff;display:flex;justify-content:center;align-items:center;box-shadow:0 0 30px #00eaff,inset 0 0 30px #00eaff}.core span{color:white;font-weight:bold;font-size:20px;letter-spacing:4px;text-shadow:0 0 15px #00eaff}.core:after{content:"";position:absolute;width:130%;height:2px;background:#00eaff;box-shadow:0 0 15px #00eaff;animation:scan 2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes reverseSpin{to{transform:rotate(-360deg)}}@keyframes scan{0%{transform:translateY(-80px)}50%{transform:translateY(80px)}100%{transform:translateY(-80px)}}.chat{position:absolute;left:10px;bottom:88px;width:280px;max-height:145px;overflow:auto;z-index:10}.msg{padding:9px;margin:5px 0;border-radius:10px;font-size:12px;line-height:1.4;background:#04313b;border-left:2px solid #00eaff}.me{text-align:right;border-left:0;border-right:2px solid #00eaff}.controls{position:absolute;bottom:18px;width:94%;max-width:650px;display:flex;gap:7px;z-index:20}input{flex:1;padding:14px 18px;border:1px solid #00eaff;border-radius:25px;background:#00151d;color:white;outline:none}button{width:50px;height:50px;border-radius:50%;border:1px solid #00eaff;background:#002b36;color:#00eaff;font-size:18px;cursor:pointer}button:hover,#mic.listening{background:#00eaff;color:#001018;box-shadow:0 0 30px #00eaff}@media(max-width:500px){.header h1{font-size:23px}.hud{width:92vw}.chat{width:220px}}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>J.A.R.V.I.S.</h1><p>PERSONAL AI • BITTU SIR</p><div id="status">● SYSTEM ONLINE</div></div>
<div class="hud"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div><div class="ticks"></div><div class="core"><span>JARVIS</span></div></div>
<div id="chat" class="chat"></div>
<div class="controls"><input id="input" placeholder="Talk to JARVIS..."><button onclick="send()">➤</button><button id="mic" onclick="listen()">🎤</button></div>
</div>
<script>
const input=document.getElementById("input"),chat=document.getElementById("chat"),status=document.getElementById("status"),mic=document.getElementById("mic");let history=[];
const websites={youtube:"https://www.youtube.com",google:"https://www.google.com",instagram:"https://www.instagram.com",facebook:"https://www.facebook.com",chatgpt:"https://chatgpt.com",github:"https://github.com",gmail:"https://mail.google.com",amazon:"https://www.amazon.in",flipkart:"https://www.flipkart.com",spotify:"https://open.spotify.com",netflix:"https://www.netflix.com"};
function addMessage(text,type){const d=document.createElement("div");d.className="msg "+type;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function speak(text){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-IN";u.rate=1;u.onstart=()=>status.textContent="● JARVIS SPEAKING";u.onend=()=>status.textContent="● SYSTEM ONLINE";speechSynthesis.speak(u)}
function localCommand(text){const q=text.toLowerCase().trim();if(q.startsWith("open ")){const site=q.substring(5).trim();if(websites[site]){window.open(websites[site],"_blank");return "Opening "+site+", Bittu sir."}return "I don't know that website, Bittu sir."}if(q==="hello"||q==="hi")return "Hello Bittu sir. What can I help you with?";if(q.includes("what is the time")||q==="time")return "The current time is "+new Date().toLocaleTimeString("en-IN");if(q.includes("what is the date")||q==="date")return "Today's date is "+new Date().toLocaleDateString("en-IN");return null}
async function askAI(text){status.textContent="● JARVIS THINKING";try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,history})});const data=await r.json();if(!r.ok)throw new Error(data.error);return data.reply}catch(e){console.error(e);return "Bittu sir, my AI server is not connected."}}
async function send(){const text=input.value.trim();if(!text)return;addMessage(text,"me");input.value="";const local=localCommand(text);let reply;if(local)reply=local;else{history.push({role:"user",content:text});reply=await askAI(text);history.push({role:"assistant",content:reply})}addMessage(reply,"ai");speak(reply)}
input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
function listen(){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){alert("Voice recognition is not supported. Please use Google Chrome.");return}const r=new Recognition();r.lang="en-IN";r.continuous=false;r.interimResults=false;mic.classList.add("listening");status.textContent="● LISTENING...";r.start();r.onresult=e=>{input.value=e.results[0][0].transcript;mic.classList.remove("listening");send()};r.onerror=e=>{console.log(e.error);mic.classList.remove("listening");status.textContent="● VOICE ERROR"};r.onend=()=>mic.classList.remove("listening")}
window.onload=()=>{const greeting="Hello Bittu sir, what can I help you with?";addMessage("🤖 "+greeting,"ai");setTimeout(()=>speak(greeting),800)}
</script>
</body>
</html>
